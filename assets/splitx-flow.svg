<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 240" width="100%" height="100%" style="background:#0c0709;border:1px solid rgba(239,35,60,0.2);border-radius:8px;">
  <defs>
    <linearGradient id="flowGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ef233c" stop-opacity="0.1" />
      <stop offset="50%" stop-color="#ef233c" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#ef233c" stop-opacity="0.1" />
    </linearGradient>

    <style>
      @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;700;800&amp;display=swap');
      .mono { font-family: 'JetBrains Mono', monospace; }
      
      @keyframes dash {
        to { stroke-dashoffset: -40; }
      }
      .flow-line {
        stroke-dasharray: 8, 8;
        animation: dash 1.5s linear infinite;
      }
      
      @keyframes pulseGlow {
        0%, 100% { opacity: 0.7; }
        50% { opacity: 1; filter: drop-shadow(0 0 8px #ef233c); }
      }
      .node-pulse {
        animation: pulseGlow 2.5s ease-in-out infinite;
      }
    </style>
  </defs>

  <!-- Title Header -->
  <rect x="0" y="0" width="900" height="34" fill="#130a0d" />
  <circle cx="20" cy="17" r="4.5" fill="#ef233c" />
  <circle cx="34" cy="17" r="4.5" fill="#f59e0b" />
  <circle cx="48" cy="17" r="4.5" fill="#10b981" />
  <text x="70" y="21" fill="#a89296" font-size="11" font-weight="700" letter-spacing="1.5" class="mono">
    PROTOCOL_EXECUTION :: TIME-SLICING &amp; SECONDARY SETTLEMENT
  </text>

  <!-- Step 1: Active Entitlement -->
  <g transform="translate(30, 65)">
    <rect width="210" height="135" rx="6" fill="#140b0e" stroke="#ef233c" stroke-opacity="0.3" stroke-width="1.5" />
    <rect x="12" y="14" width="60" height="18" rx="3" fill="#240f14" />
    <text x="20" y="26" fill="#ef233c" font-size="9" font-weight="800" class="mono">STEP 01</text>
    <text x="12" y="52" fill="#f4e6e3" font-size="13" font-weight="700" class="mono">Full Subscription</text>
    <text x="12" y="74" fill="#a89296" font-size="10.5" class="mono">Netflix / AI API · 30 Days</text>
    <path d="M 12 90 L 198 90" stroke="#240f14" stroke-width="1" />
    <text x="12" y="112" fill="#10b981" font-size="10" font-weight="700" class="mono">Status: Active ERC-721</text>
    <text x="12" y="127" fill="#6f5e62" font-size="9" class="mono">Token #1042 · Owner A</text>
  </g>

  <!-- Connector 1 -->
  <line x1="240" y1="132" x2="330" y2="132" stroke="#ef233c" stroke-width="2" class="flow-line" />
  <polygon points="330,128 338,132 330,136" fill="#ef233c" />

  <!-- Step 2: Protocol Split -->
  <g transform="translate(340, 65)">
    <rect width="220" height="135" rx="6" fill="#1a090e" stroke="#ef233c" stroke-width="1.5" class="node-pulse" />
    <rect x="12" y="14" width="60" height="18" rx="3" fill="#ef233c" />
    <text x="20" y="26" fill="#ffffff" font-size="9" font-weight="800" class="mono">STEP 02</text>
    <text x="12" y="52" fill="#ffffff" font-size="13" font-weight="800" class="mono">SplitX Protocol Split</text>
    <text x="12" y="74" fill="#f4e6e3" font-size="10.5" class="mono">Keep: <tspan fill="#10b981" font-weight="700">10 Days</tspan></text>
    <text x="12" y="92" fill="#f4e6e3" font-size="10.5" class="mono">Sell: <tspan fill="#ef233c" font-weight="700">20 Days</tspan></text>
    <path d="M 12 104 L 208 104" stroke="#361219" stroke-width="1" />
    <text x="12" y="124" fill="#ff4d6d" font-size="9.5" font-weight="700" class="mono">SplitXEntitlement.split()</text>
  </g>

  <!-- Connector 2 -->
  <line x1="560" y1="132" x2="650" y2="132" stroke="#ef233c" stroke-width="2" class="flow-line" />
  <polygon points="650,128 658,132 650,136" fill="#ef233c" />

  <!-- Step 3: Marketplace Settlement -->
  <g transform="translate(660, 65)">
    <rect width="210" height="135" rx="6" fill="#140b0e" stroke="#ef233c" stroke-opacity="0.3" stroke-width="1.5" />
    <rect x="12" y="14" width="60" height="18" rx="3" fill="#240f14" />
    <text x="20" y="26" fill="#ef233c" font-size="9" font-weight="800" class="mono">STEP 03</text>
    <text x="12" y="52" fill="#f4e6e3" font-size="13" font-weight="700" class="mono">Instant Settlement</text>
    <text x="12" y="74" fill="#a89296" font-size="10.5" class="mono">Buyer B pays 0.015 ETH</text>
    <path d="M 12 90 L 198 90" stroke="#240f14" stroke-width="1" />
    <text x="12" y="112" fill="#10b981" font-size="10" font-weight="700" class="mono">✓ Seller receives ETH</text>
    <text x="12" y="127" fill="#10b981" font-size="10" font-weight="700" class="mono">✓ Buyer gets access token</text>
  </g>
</svg>
